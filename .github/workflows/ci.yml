name: ci
on:
  push:
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Chromium and bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser bubblewrap || sudo apt-get install -y chromium bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces, which Chromium's sandbox needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Gate
        run: scripts/gate.sh
      - name: Limits on pure cgroup v2 (memory.max path)
        # ubuntu-24.04 is pure cgroup v2. Create an empty child of the root cgroup
        # with memory enabled (the root is exempt from the no-internal-processes
        # rule) and run as root so moving the browser into it is permitted.
        run: |
          sudo mkdir -p /sys/fs/cgroup/rustplay-ci
          echo "+memory +cpu" | sudo tee /sys/fs/cgroup/cgroup.subtree_control
          echo "+memory +cpu" | sudo tee /sys/fs/cgroup/rustplay-ci/cgroup.subtree_control
          sudo -E env "PATH=$PATH" RUSTPLAY_CGROUP_PARENT=/sys/fs/cgroup/rustplay-ci \
            cargo test --test limits -- --nocapture 2>&1 | tee limits.log
          ! grep -q "unsupported on this host" limits.log   # must be real enforcement, not the fallback branch
  macos-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets
      - run: cargo test --lib
